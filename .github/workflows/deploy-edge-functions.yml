name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare function directory
        run: |
          mkdir -p supabase/functions/make-server-ec8fe879
          cp -r supabase/functions/server/* supabase/functions/make-server-ec8fe879/
          cp supabase/functions/make-server-ec8fe879/index.tsx supabase/functions/make-server-ec8fe879/index.ts

      - name: Deploy make-server-ec8fe879
        run: supabase functions deploy make-server-ec8fe879 --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # This step used to be missing entirely, which meant every push to
      # supabase/functions/stripe-charge/** ran this workflow (its path
      # matches the trigger above) but never actually redeployed it — the
      # step below only ever touched make-server-ec8fe879. Fixes to
      # stripe-charge silently never went live until manually deployed.
      - name: Deploy stripe-charge
        run: supabase functions deploy stripe-charge --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy verification-decision
        run: supabase functions deploy verification-decision --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy rental-agreement-sign
        run: supabase functions deploy rental-agreement-sign --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # checkout-quote, stripe-charge, and rental-agreement-sign all import
      # ../_shared/pricing.ts by relative path — the CLI bundles it in from
      # outside the function's own directory automatically, nothing to copy.
      - name: Deploy checkout-quote
        run: supabase functions deploy checkout-quote --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy claim-identity
        run: supabase functions deploy claim-identity --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy finalize-cash-payment
        run: supabase functions deploy finalize-cash-payment --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy release-pending-earnings
        run: supabase functions deploy release-pending-earnings --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-process-payout
        run: supabase functions deploy admin-process-payout --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy request-payout
        run: supabase functions deploy request-payout --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy process-refund
        run: supabase functions deploy process-refund --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy delete-listing
        run: supabase functions deploy delete-listing --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-login
        run: supabase functions deploy admin-login --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy support-ai-chat
        run: supabase functions deploy support-ai-chat --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy support-case-admin-action
        run: supabase functions deploy support-case-admin-action --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy boost-charge
        run: supabase functions deploy boost-charge --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy boost-stop
        run: supabase functions deploy boost-stop --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy boost-expire
        run: supabase functions deploy boost-expire --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy verification-reveal-id
        run: supabase functions deploy verification-reveal-id --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy verification-view-document
        run: supabase functions deploy verification-view-document --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # These two were previously deployed manually and never added here,
      # so pushes touching them silently never redeployed until now.
      - name: Deploy manage-application
        run: supabase functions deploy manage-application --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-boost-config
        run: supabase functions deploy admin-boost-config --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy submit-opportunity-application
        run: supabase functions deploy submit-opportunity-application --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy publish-opportunity
        run: supabase functions deploy publish-opportunity --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy subscription-charge
        run: supabase functions deploy subscription-charge --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy cancel-subscription
        run: supabase functions deploy cancel-subscription --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fund-opportunity
        run: supabase functions deploy fund-opportunity --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy verify-identity
        run: supabase functions deploy verify-identity --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy setup-payout-account
        run: supabase functions deploy setup-payout-account --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy submit-payout-bank-account
        run: supabase functions deploy submit-payout-bank-account --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-verification-link
        run: supabase functions deploy create-verification-link --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy sync-payout-method-status
        run: supabase functions deploy sync-payout-method-status --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy check-auth-methods
        run: supabase functions deploy check-auth-methods --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy manage-hire-request
        run: supabase functions deploy manage-hire-request --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fund-hire
        run: supabase functions deploy fund-hire --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy device-check
        run: supabase functions deploy device-check --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy device-send-code
        run: supabase functions deploy device-send-code --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy device-verify-code
        run: supabase functions deploy device-verify-code --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-review
        run: supabase functions deploy create-review --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-message-notification
        run: supabase functions deploy send-message-notification --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-follow-notification
        run: supabase functions deploy send-follow-notification --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # This workflow deploys a fixed, named list of functions rather than
      # scanning supabase/functions/** -- pushing a brand-new function
      # directory matches the path trigger above (so the workflow runs)
      # but silently deploys nothing for it without an explicit step here.
      # undo-swipe/record-swipe/notify-event/check-mutual-follow were all
      # added and pushed without one, so every call to them 404'd (fire-
      # and-forget callers swallow that silently) until this was added.
      - name: Deploy undo-swipe
        run: supabase functions deploy undo-swipe --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy record-swipe
        run: supabase functions deploy record-swipe --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy notify-event
        run: supabase functions deploy notify-event --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy check-mutual-follow
        run: supabase functions deploy check-mutual-follow --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-guest-support-case
        run: supabase functions deploy create-guest-support-case --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy emergency-charge
        run: supabase functions deploy emergency-charge --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy emergency-expire
        run: supabase functions deploy emergency-expire --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy check-emergency-access
        run: supabase functions deploy check-emergency-access --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare function directory
        run: |
          mkdir -p supabase/functions/make-server-ec8fe879
          cp -r supabase/functions/server/* supabase/functions/make-server-ec8fe879/
          cp supabase/functions/make-server-ec8fe879/index.tsx supabase/functions/make-server-ec8fe879/index.ts

      - name: Deploy make-server-ec8fe879
        run: supabase functions deploy make-server-ec8fe879 --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # This step used to be missing entirely, which meant every push to
      # supabase/functions/stripe-charge/** ran this workflow (its path
      # matches the trigger above) but never actually redeployed it — the
      # step below only ever touched make-server-ec8fe879. Fixes to
      # stripe-charge silently never went live until manually deployed.
      - name: Deploy stripe-charge
        run: supabase functions deploy stripe-charge --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy verification-decision
        run: supabase functions deploy verification-decision --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy rental-agreement-sign
        run: supabase functions deploy rental-agreement-sign --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # checkout-quote, stripe-charge, and rental-agreement-sign all import
      # ../_shared/pricing.ts by relative path — the CLI bundles it in from
      # outside the function's own directory automatically, nothing to copy.
      - name: Deploy checkout-quote
        run: supabase functions deploy checkout-quote --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy claim-identity
        run: supabase functions deploy claim-identity --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy finalize-cash-payment
        run: supabase functions deploy finalize-cash-payment --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy release-pending-earnings
        run: supabase functions deploy release-pending-earnings --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-process-payout
        run: supabase functions deploy admin-process-payout --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy request-payout
        run: supabase functions deploy request-payout --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy process-refund
        run: supabase functions deploy process-refund --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-login
        run: supabase functions deploy admin-login --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy support-ai-chat
        run: supabase functions deploy support-ai-chat --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy support-case-admin-action
        run: supabase functions deploy support-case-admin-action --project-ref snajrdvcwsbjqefaftsj --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
